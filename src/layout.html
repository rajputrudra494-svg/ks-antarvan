<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="theme-color" content="#16281e">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="K's Antarvan">
  <meta property="og:title" content="{{title}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="assets/img/interior-glasshouse.webp">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300..700;1,300..600&family=Jost:wght@300;400;500&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>
    (function () {
      var d = document.documentElement;
      d.classList.add('js');
      // ES modules do not load over file://, and a blocked script would leave the
      // reveal-on-scroll blocks invisible. If nothing has booted, show the plain page.
      setTimeout(function () { if (!window.__antarvanReady) d.classList.remove('js'); }, 2500);
    })();
  </script>
{{head}}
</head>
<body data-page="{{page}}">
  <a class="skip" href="#main">Skip to content</a>
{{> nav}}
  <main id="main">
{{content}}
  </main>
{{> footer}}
  <script type="module" src="{{script}}"></script>
</body>
</html>
